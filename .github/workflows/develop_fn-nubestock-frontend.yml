name: Build and deploy Azure Static Web App - nubestock-dashboard

on:
  push:
    branches:
      - develop
      - uat
      - master
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - develop
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment a desplegar'
        required: false
        type: choice
        options:
          - NUBESTOCK_DEV
          - NUBESTOCK_UAT
          - NUBESTOCK_PRD
        default: 'NUBESTOCK_DEV'

jobs:
  deploy:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    uses: Nubestock/nubestock-workflows/.github/workflows/static-web-app-deploy-action.yml@master
    permissions:
      contents: read
    with:
      environment: >-
        ${{
          github.event.inputs.environment != '' && github.event.inputs.environment
          || github.ref_name == 'develop' && 'NUBESTOCK_DEV'
          || github.ref_name == 'uat' && 'NUBESTOCK_UAT'
          || github.ref_name == 'master' && 'NUBESTOCK_PRD'
          || 'NUBESTOCK_DEV'
        }}
      node_version: '20'
    secrets:
      AZURE_STATIC_WEB_APPS_API_TOKEN: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
      VITE_API_TIMEOUT: ${{ secrets.VITE_API_TIMEOUT }}
      VITE_API_CODE: ${{ secrets.VITE_API_CODE }}
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  # Preview en PRs (usa NUBESTOCK_DEV)
  build_and_deploy_job:
    if: github.event_name == 'pull_request' && (github.event.action == 'opened' || github.event.action == 'synchronize' || github.event.action == 'reopened')
    runs-on: ubuntu-latest
    name: Build and Deploy (PR Preview)
    environment: NUBESTOCK_DEV
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          lfs: false
      - name: Build And Deploy
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          app_location: "/"
          api_location: ""
          output_location: "dist"

  close_pull_request_job:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Pull Request Job
    environment: NUBESTOCK_DEV
    steps:
      - name: Close Pull Request
        id: closepullrequest
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: "close"
          app_location: "/"
          output_location: "dist"
