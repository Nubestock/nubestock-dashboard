# Workflow DESHABILITADO temporalmente (se usa develop_fn-nubestock-frontend.yml + nubestock-workflows)
name: Azure Static Web Apps CI/CD

on:
  push:
    branches:
      - develop
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - develop

jobs:
  build:
    if: false  # Deshabilitado temporalmente
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          submodules: true
          lfs: false

      - name: Check variables are set
        run: |
          if [ -z "$PUBLIC_BASE_API_URL" ]; then
            echo "ERROR: PUBLIC_BASE_API_URL is not set. Please configure it in GitHub Secrets."
            exit 1
          fi
          if [ -z "$PUBLIC_API_KEY" ]; then
            echo "ERROR: PUBLIC_API_KEY is not set. Please configure it in GitHub Secrets."
            exit 1
          fi
        env:
          PUBLIC_BASE_API_URL: ${{ secrets.PUBLIC_BASE_API_URL }}
          PUBLIC_API_KEY: ${{ secrets.PUBLIC_API_KEY }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'

      - name: Install dependencies
        run: npm install

      - name: Build app
        run: npm run build
        env:
          PUBLIC_BASE_API_URL: ${{ secrets.PUBLIC_BASE_API_URL }}
          PUBLIC_API_KEY: ${{ secrets.PUBLIC_API_KEY }}
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-dist
          path: dist/client

  deploy:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: dashboard-dist
          path: .

      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        env:
          PUBLIC_BASE_API_URL: ${{ secrets.PUBLIC_BASE_API_URL }}
          PUBLIC_API_KEY: ${{ secrets.PUBLIC_API_KEY }}
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          app_location: "/"
          api_location: ""
          output_location: "dist/client"
